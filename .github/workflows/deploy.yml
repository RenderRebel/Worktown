name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Build and Push to Artifact Registry
        run: |
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nearhelp/api:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy nearhelp-api \
            --image us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nearhelp/api:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets="FIREBASE_CREDENTIALS_JSON=firebase-credentials:latest"
